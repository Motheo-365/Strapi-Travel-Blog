services:
  strapi:
    build: ./server
    ports:
      - "1337:1337"
    environment:
      JWT_SECRET: super-secret-jwt-key-change-me
      ADMIN_JWT_SECRET: super-secret-admin-key-change-me
      APP_KEYS: key1,key2,key3,key4
      API_TOKEN_SALT: some-random-salt
      TRANSFER_TOKEN_SALT: another-random-salt

  nuxt:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - strapi
    environment:
      NUXT_PUBLIC_STRAPI_URL: http://strapi:1337